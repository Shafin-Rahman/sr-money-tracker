<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SR Money Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components/sidebar.css">
  <link rel="stylesheet" href="css/components/cards.css">
  <link rel="stylesheet" href="css/components/forms.css">
  <link rel="stylesheet" href="css/components/tables.css">
  <link rel="stylesheet" href="css/components/modal.css">
  <link rel="stylesheet" href="css/components/dark-mode.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="fas fa-coins"></i>
          <span>SR Money</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle">
          <i class="fas fa-bars"></i>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <a href="#dashboard" class="nav-item active" data-page="dashboard">
          <i class="fas fa-chart-pie"></i>
          <span data-i18n="nav_dashboard">Dashboard</span>
        </a>
        <a href="#accounts" class="nav-item" data-page="accounts">
          <i class="fas fa-wallet"></i>
          <span data-i18n="nav_accounts">Accounts</span>
        </a>
        <a href="#transactions" class="nav-item" data-page="transactions">
          <i class="fas fa-exchange-alt"></i>
          <span data-i18n="nav_transactions">Transactions</span>
        </a>
        <a href="#categories" class="nav-item" data-page="categories">
          <i class="fas fa-tags"></i>
          <span data-i18n="nav_categories">Categories</span>
        </a>
        <a href="#loans" class="nav-item" data-page="loans">
          <i class="fas fa-hand-holding-usd"></i>
          <span data-i18n="nav_loans">Loans</span>
        </a>
        <a href="#budgets" class="nav-item" data-page="budgets">
          <i class="fas fa-chart-line"></i>
          <span data-i18n="nav_budgets">Budgets</span>
        </a>
        <a href="#savings" class="nav-item" data-page="savings">
          <i class="fas fa-piggy-bank"></i>
          <span data-i18n="nav_savings">Savings</span>
        </a>
        <a href="#recurring" class="nav-item" data-page="recurring">
          <i class="fas fa-calendar-repeat"></i>
          <span data-i18n="nav_recurring">Recurring</span>
        </a>
        <a href="#reports" class="nav-item" data-page="reports">
          <i class="fas fa-file-alt"></i>
          <span data-i18n="nav_reports">Reports</span>
        </a>
        <a href="#settings" class="nav-item" data-page="settings">
          <i class="fas fa-cog"></i>
          <span data-i18n="nav_settings">Settings</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="theme-toggle">
          <button id="themeBtn" class="icon-btn" title="Toggle Theme">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-right">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="globalSearch" data-i18n="search_placeholder" data-i18n-attr="placeholder" placeholder="Search transactions, accounts, people..." />
          </div>
          <button class="btn btn-primary" id="quickAddBtn">
            <i class="fas fa-plus"></i>
            <span data-i18n="add_transaction">Add Transaction</span>
          </button>
        </div>
      </header>

      <div class="page-content" id="pageContent"></div>

      <div class="floating-btn" id="floatingBtn">
        <i class="fas fa-plus"></i>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Modal</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
